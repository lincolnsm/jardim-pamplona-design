<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardim Pamplona Shopping</title>
<link rel="icon" href="assets/logo.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #ffffff; color: #4a3f45; font-family: Poppins, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #e0602c; }
</style>
</helmet>

<div style="width:100%;max-width:100%;overflow-x:hidden;background:#ffffff">
  <dc-import name="SiteHeader" active="Gastronomia" hint-size="100%,140px"></dc-import>

  <section style="position:relative;background:#563349">
    <div style="position:relative;width:100%;aspect-ratio:1528/500">
      <img src="assets/gastro-prato.png" alt="Pratos do shopping" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
      <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(45,24,37,0.9),rgba(45,24,37,0.3))"></div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:clamp(24px,5vw,72px);color:#ffffff">
        <span style="font-size:11px;letter-spacing:0.24em;color:#e8b830;font-weight:600">GASTRONOMIA</span>
        <h1 style="font-weight:700;font-size:clamp(30px,4.4vw,56px);line-height:1.08;margin:0;max-width:620px">Onde comer nos Jardins</h1>
        <p style="font-size:clamp(14px,1.4vw,18px);line-height:1.6;color:#e6d6e0;max-width:520px;margin:0">Do almoço rápido na praça de alimentação ao jantar com vista no Rooftop.</p>
      </div>
    </div>
  </section>

  <section style="max-width:1280px;margin:0 auto;padding:clamp(44px,5.5vw,76px) 24px 0">
    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px">
      <sc-for list="{{ filters }}" as="fl" hint-placeholder-count="4">
        <button onClick="{{ fl.go }}" style="padding:11px 22px;border-radius:999px;border:1px solid {{ fl.border }};background:{{ fl.bg }};color:{{ fl.color }};font-size:13.5px;font-weight:500;cursor:pointer">{{ fl.label }}</button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;max-width:1000px;margin:0 auto">
      <sc-for list="{{ visible }}" as="f" hint-placeholder-count="6">
        <div style="border:1px solid #f0e6e0;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:400px">
          <div style="height:205px;flex:0 0 205px;overflow:hidden;background:#f1dbcd">
            <sc-if value="{{ f.img }}" hint-placeholder-val="{{ false }}">
              <img src="{{ f.img }}" alt="{{ f.title }}" style="display:block;width:100%;height:100%;object-fit:cover" />
            </sc-if>
          </div>
          <div style="padding:20px">
            <div style="font-size:10px;letter-spacing:0.16em;color:#1d4d43;font-weight:600">{{ f.tag }}</div>
            <div style="font-weight:600;font-size:19px;margin:9px 0 7px;color:#563349">{{ f.title }}</div>
            <div style="font-size:13.5px;color:#7a6a73;line-height:1.6">{{ f.text }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="margin-top:clamp(44px,5.5vw,76px);background:#f9e4d7;padding:clamp(44px,5.5vw,76px) 24px">
    <div style="max-width:1280px;margin:0 auto">
      <div style="text-align:center;margin-bottom:32px">
        <h2 style="font-weight:600;font-size:clamp(26px,3.2vw,40px);margin:0;color:#563349">Operações de alimentação</h2>
        <div style="width:58px;height:2px;background:#563349;margin:16px auto 0"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px">
        <sc-for list="{{ brands }}" as="b" hint-placeholder-count="4">
          <div style="background:#ffffff;border-radius:6px;overflow:hidden">
            <div style="height:130px;display:grid;place-items:center;padding:16px;border-bottom:1px solid #f4ece8">
              <sc-if value="{{ b.logo }}" hint-placeholder-val="{{ false }}">
                <img src="{{ b.logo }}" alt="{{ b.name }}" style="max-width:100%;max-height:100px;width:auto;height:auto;object-fit:contain" />
              </sc-if>
            </div>
            <div style="padding:16px">
              <div style="font-weight:600;font-size:16px;color:#563349">{{ b.name }}</div>
              <div style="font-size:12.5px;color:#7a6a73;margin-top:6px">{{ b.meta }}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="text-align:center;margin-top:34px">
        <a href="rooftop.html" style="display:inline-block;padding:14px 32px;border-radius:4px;background:#563349;color:#ffffff;font-weight:500;font-size:14.5px" style-hover="background:#432539;color:#ffffff">Conheça o Rooftop</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { filter: "Tudo" };

  cards() {
    return [
      { tag: "ROOFTOP", cat: "Rooftop", title: "Jantar com vista", text: "Cozinha autoral, coquetelaria e música ao vivo no Piso 4.", img: "assets/gastro-rooftop.png" },
      { tag: "PRAÇA DE ALIMENTAÇÃO", cat: "Praça de alimentação", title: "Almoço rápido", text: "Opções para todos os gostos, das 11h às 22h.", img: "assets/gastro-praca.png" },
      { tag: "CAFETERIA", cat: "Cafés", title: "Café da tarde", text: "Confeitaria, cafés especiais e doces nos Jardins.", img: "assets/gastro-cafe.png" },
      { tag: "SABORES DO NOSSO SHOPPING", cat: "Restaurantes", title: "Pratos do dia", text: "Do saudável ao clássico, nos restaurantes do shopping.", img: "assets/gastro-prato.png" },
      { tag: "ROOFTOP", cat: "Restaurantes", title: "Las Leñas", text: "Parrilla uruguaia com mesas ao ar livre no Piso 4.", img: "assets/rooftop-las-lenas.jpg" },
      { tag: "ROOFTOP", cat: "Restaurantes", title: "Souq", text: "Culinária libanesa em salão envidraçado.", img: "assets/rooftop-souq.jpg" }
    ];
  }

  renderVals() {
    const cats = ["Tudo", "Rooftop", "Restaurantes", "Praça de alimentação", "Cafés"];
    const cur = this.state.filter;
    return {
      filters: cats.map(c => ({
        label: c,
        go: () => this.setState({ filter: c }),
        bg: c === cur ? "#563349" : "#ffffff",
        color: c === cur ? "#ffffff" : "#563349",
        border: c === cur ? "#563349" : "#e3d3da"
      })),
      visible: cur === "Tudo" ? this.cards() : this.cards().filter(c => c.cat === cur),
      brands: [
        { name: "Souq Culinária Libanesa", meta: "Rooftop · Piso 4", logo: "assets/loja-souq.png" },
        { name: "The Steak Factory", meta: "Rooftop · Piso 4", logo: "assets/loja-steak-factory.jpg" },
        { name: "Oakberry Açaí Bowls", meta: "Piso 1 · Praça de Alimentação", logo: "assets/loja-oakberry.png" },
        { name: "Burger King", meta: "Piso 1 · Praça de Alimentação", logo: "assets/loja-burger-king.jpg" },
        { name: "Cacau Show", meta: "Térreo · Chocolates", logo: "assets/loja-cacau-show.png" }
      ]
    };
  }
}
</script>
</body>
</html>
