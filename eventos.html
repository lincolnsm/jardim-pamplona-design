<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardim Pamplona Shopping</title>
<link rel="icon" href="assets/logo.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #ffffff; color: #4a3f45; font-family: Poppins, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #e0602c; }
</style>
</helmet>

<div style="width:100%;max-width:100%;overflow-x:hidden;background:#ffffff">
  <dc-import name="SiteHeader" active="Eventos" hint-size="100%,140px"></dc-import>

  <section style="background:#f9e4d7;padding:clamp(36px,4.5vw,60px) 24px">
    <div style="max-width:1280px;margin:0 auto;text-align:center">
      <span style="font-size:11px;letter-spacing:0.24em;color:#6b4f60;font-weight:600">EVENTOS</span>
      <h1 style="font-weight:600;font-size:clamp(28px,3.8vw,46px);margin:12px 0 0;color:#563349">Fique por dentro das novidades</h1>
      <div style="width:58px;height:2px;background:#563349;margin:16px auto 0"></div>
    </div>
  </section>

  <section style="max-width:1280px;margin:0 auto;padding:clamp(40px,5vw,66px) 24px 0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px">
      <sc-for list="{{ events }}" as="e" hint-placeholder-count="4">
        <div style="border:1px solid #f0e6e0;border-radius:6px;overflow:hidden">
          <div style="height:230px;overflow:hidden;background:#efd8ca">
            <sc-if value="{{ e.img }}" hint-placeholder-val="{{ false }}">
              <img src="{{ e.img }}" alt="{{ e.title }}" style="display:block;width:100%;height:100%;object-fit:cover" />
            </sc-if>
          </div>
          <div style="display:flex;gap:18px;padding:22px;align-items:flex-start">
            <div style="text-align:center;background:#563349;color:#ffffff;border-radius:4px;padding:11px 13px;min-width:66px">
              <div style="font-weight:700;font-size:24px;line-height:1">{{ e.day }}</div>
              <div style="font-size:9.5px;letter-spacing:0.14em;margin-top:4px;color:#e6cfdc;font-weight:600">{{ e.month }}</div>
            </div>
            <div>
              <div style="font-weight:600;font-size:19px;line-height:1.3;color:#563349">{{ e.title }}</div>
              <div style="font-size:13.5px;color:#7a6a73;margin-top:8px;line-height:1.6">{{ e.text }}</div>
              <div style="font-size:11px;letter-spacing:0.12em;color:#1d4d43;font-weight:600;margin-top:12px">{{ e.place }}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="margin-top:clamp(44px,5.5vw,76px);background:#563349;color:#f6ecf1;padding:clamp(40px,5vw,66px) 24px">
    <div style="max-width:900px;margin:0 auto;text-align:center">
      <h2 style="font-weight:600;font-size:clamp(22px,2.6vw,32px);margin:0 0 14px;color:#ffffff">Quer receber a programação por e-mail?</h2>
      <p style="font-size:15px;color:#dcc9d5;margin:0 0 26px;line-height:1.6">Cadastre seu e-mail e fique por dentro de todas as novidades do Jardim Pamplona Shopping.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">
        <input placeholder="E-mail" style="flex:1 1 280px;max-width:380px;padding:15px 18px;border:0;border-radius:4px;font-size:15px;outline:none;color:#4a3f45" />
        <button style="padding:15px 30px;border-radius:4px;border:0;background:#e8b830;color:#3b2015;font-size:14.5px;font-weight:600;cursor:pointer">Cadastrar</button>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      events: [
        { day: "26", month: "SET", title: "Blues Beer #NoPam", text: "Sábado e domingo, a partir das 12h. Música ao vivo e cervejas especiais.", place: "ROOFTOP · PISO 4", img: "assets/evento-blues-beer.png" },
        { day: "21", month: "SET", title: "Oficina Infantil de Primavera", text: "Domingo, das 14h às 18h. Atividade gratuita para crianças de 4 a 10 anos.", place: "PISO 1", img: "assets/evento-oficina-primavera.png" },
        { day: "27", month: "SET", title: "Feira de Adoção de Pets", text: "Sábado, das 11h às 17h, com ONGs parceiras.", place: "ENTRADA DA RUA PAMPLONA", img: "assets/evento-adocao-pets.png" },
        { day: "04", month: "OUT", title: "Música ao vivo no Rooftop", text: "Sexta-feira, a partir das 19h. Entrada gratuita.", place: "ROOFTOP · PISO 4", img: "assets/evento-musica-rooftop.png" }
      ]
    };
  }
}
</script>
</body>
</html>
