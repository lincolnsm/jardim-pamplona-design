<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardim Pamplona Shopping</title>
<link rel="icon" href="assets/logo.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:40;background:#ffffff">
  <div style="max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:16px 28px">
    <a href="index.html" style="display:flex;align-items:center">
      <img src="assets/logo.png" alt="Jardim Pamplona Shopping" style="display:block;height:52px;width:auto" />
    </a>
    <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:26px;margin-left:auto;font-size:15px;color:#3d3238">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="8">
        <a href="{{ n.href }}" style="border-bottom:2px solid {{ n.line }};padding-bottom:2px;color:{{ n.color }}" style-hover="color:#e0602c">{{ n.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:18px;padding-left:22px;border-left:1px solid #e6e0e3">
      <a href="https://www.instagram.com/jardimpamplonashopping/" aria-label="Instagram" style="display:flex;color:#3d3238" style-hover="color:#e0602c">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"></circle></svg>
      </a>
      <button aria-label="Buscar" style="border:0;background:transparent;color:#3d3238;cursor:pointer;padding:0;display:flex">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      </button>
    </div>
  </div>
  <div style="background:#e9e6e4">
    <div style="max-width:1440px;margin:0 auto;padding:9px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-end;font-size:13.5px;color:#4a4446">
      <a href="#" style="display:flex;align-items:center;gap:8px" style-hover="color:#e0602c">Shopping aberto até as 22:00 <span style="font-size:11px">⌄</span></a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "";
    const items = [
      { label: "Lojas", href: "lojas.html" },
      { label: "Gastronomia", href: "gastronomia.html" },
      { label: "Rooftop", href: "rooftop.html" },
      { label: "Cinema", href: "#" },
      { label: "Eventos", href: "eventos.html" },
      { label: "Planeje sua visita", href: "planeje-sua-visita.html" },
      { label: "Contato", href: "#" },
      { label: "Seja um lojista", href: "#" }
    ];
    return {
      navItems: items.map(i => ({
        ...i,
        line: i.label === active ? "#e0602c" : "transparent",
        color: i.label === active ? "#e0602c" : "#3d3238"
      }))
    };
  }
}
</script>
</body>
</html>
